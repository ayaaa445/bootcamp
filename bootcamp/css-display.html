<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Example</title>
    <link rel="stylesheet" href="assets/css/css-display.css">
</head>
<body>
    <span class="block-box">Block Element 1</span>
    <span class="block-box">Block Element 2</span>

    <hr>
    <h2>Display Example</h2>
    <p>Hello, welcome to my website.<span class="inline">Thank you for visiting </span> my website.</p>

    <hr>
    <h2>Display Inline black Example</h2>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>

    <hr>
    <h2>Example of : display: none;</h2>
    <div class="visible-box">Box A (Visible)</div>
    <div class="hidden-box">Box B (Conpletely hidden)</div>
    <div class="visible-box">Box C (Sits immediately after Box A)</div>

</body>
</html>
