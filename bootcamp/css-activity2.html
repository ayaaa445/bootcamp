<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Activity2</title>
    <link rel="stylesheet" href="assets/css/css-activity2.css">    
</head>
<body>
    <div class="container">
        <h1 class="title">Profil Cards</h1>
        <div class="card-wrapper">
            <div class="border-box">
                <img src="assets/images/business_man.png" alt="man" class="card-top">
                <div class="card-body">
                    <h2 class="card-name">John Doe</h2>
                    <p class="card-job">Architect and Designer</p>
                </div>
            </div>
        </div>
        <div class="card border-box">
            <img src="assets/images/business_woman.png" alt="woman" class="card-top">
            <div class="card-body">
                <h2 class="card-name">Jane Doe</h2>
                <p class="card-job"><Colgroup>Chef</p>
            </div>
        </div>
    </div>
</body>
</html>
