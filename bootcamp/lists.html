<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>
    <h1>Ordered List</h1>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <hr>

    <h1>Unordered List</h1>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>  
    </ul>

    <hr>

    <h1>Nested List</h1>
    <ol>
        <li>Fruits</li>
            <ul>
                <li>Apple</li>
                <li>Banana</li>
            </ul>
        <li>Dessrets
            <ul>
                <li>Chocolate</li>
                <li>Cake</li>
            </ul>
        </li>
    </ol>
</body>
</html>
