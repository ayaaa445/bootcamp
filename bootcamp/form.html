<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="#" method="#">
        <label for="full-name">Full Name</label>
        <input type="text" name="Full name" id="Full -name" required placeholder="Example: Joho Smith"><br>

        <label for="password">Passwod:</label> 
        <input type="password" name="uesr_password"><br>

        <label for="age">Age</label>
        <input type="number" name="age" id="age" min="18" max="60"><br>

        <label for="birthday">Birthday</label>
        <input type="date" name="birthday" id="birthday"><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br>

        <label for="commets">Comments:</label><br>
        <textarea name="commets" id="comments" cols="60" rows="10"></textarea><br>

        <p>Please select your favarite music:</p>

        <input type="radio" name="music" id="rock" value="rock">
        <label for="rock">Rock</label>
        <input type="radio" name="music" id="pop" value="pop">
        <label for="pop">Pop</label>
        <input type="radio" name="music" id="jazz" value="jazz">
        <label for="jazz">Jazz</label>
        <br>

        <p>Please select your favorite food</p>
        <input type="checkbox" nema="food" id="ramen" value="ramen">
        <label for="ramen">Ramen</label>
        <input type="checkbox" name="food" id="sushi" value="sushi">
        <label for="sushi">Sushi</label>
        <input type="checkbox" name="food" id="curry" value="curry">
        <label for="curry">Curry</label>
        <br>
 
        <label for="device">What is your device</label>
        <select name="device" id="device">
            <option value="macbook">Macbook</option>
            <option value="ipat">iPat</option>
            <option value="iphone">iPhone</option>
        </select>
        <br><br>

        <label for="car">Select a car:</label>
        <select name="car" id="car" multiple>
            <option value="toyota">Toyota</option>
            <option value="nissan">Nissan</option>
            <option value="honda">Honda</option>
        </select>
        <br><br>

        <input type="file" name="file">
        <br><br>

        <input type="submit" name="btn_submit" value="Submit">or
        <button type="submit" name="submit">Submit</button>
    </form>
</body>
</html>
