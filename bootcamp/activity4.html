<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity4</title>
</head>
<body>
    <h1>Please fill this survey fome</h1>

    <form action="">
        <table>
            <tr>
                <td><label for="first-name">First Name:</label></td>
                <td><input type="text" id="first-name" name="first-name"></td>
                <td><label for="mi">MI:</label></td>
                <td><input type="text" id="mi" name="mi"></td>
                <td><label for="last-name">Last Name:</label></td>
                <td><input type="text" id="last-name" name="last-name"></td>
            </tr>
            <tr>
                <td><label for="city">City:</label></td>
                <td><input type="text" id="city" name="city"></td>
                <td><label for="state">State:</label></td>
                <td><input type="text" id="state" name="state"></td>
                <td><label for="zip code">Zip Code:</label></td>
                <td><input type="text" id="zip code" name="zip code"></td>
            </tr>   
        </table>
            <span>Choose a Sport:</span>
            <br>
            <input type="checkbox" id="basketboll" name="sport" value="basketboll">
            <label for="basketboll">Basketboll</label>
            <input type="checkbox" id="footboll" name="sport" value="footboll">
            <label for="footboll">Footboll</label>
            <input type="checkbox" id="hockey" name="sport" value="hockey">
            <label for="hockey">Hockey</label>
            <br>

            <span>Choose a year:</span>
            <br>
            <input type="radio" id="" name="year" value="freshman">
            <label for="freshman">Freshman</label>
            <input type="radio" id="sophmore" name="year" value="sophmore">
            <label for="sophmore">Sophmore</label>
            <input type="radio" id="junior" name="year" value="junior">
            <label for="junior">Junior</label>
            <input type="radio" id="senior" name="year" value="senior">
            <label for="senior">Senior</label>
            <br>

            <label for="food">Choose your favorite food:</label>
            <br>
            <select name="food" id="food" multiple>
            <option value="chips">Chips</option>
            <option value="pizza">Pizza</option>
            <option value="nachos">Nachos</option>
            </select>
            <br>
            <br>

            <textarea name="comemnt" id="comemnt" placeholder="Please let us know your comemnt" cols="25" rows="5"></textarea>
            <br>
            <input type="submit" value="sent it">
            <input type="reset" value="clear it">
    </form>

</body>
</html>
