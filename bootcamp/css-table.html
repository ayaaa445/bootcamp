<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Table</title>
    <link rel="stylesheet" href="assets/css/css-table.css">
</head>
<body>
    <h3>CSS Table</h3>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>31</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Peter Parker</td>
            <td></td>
        </tr>
    </table>


</body>
</html>
